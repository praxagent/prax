# Opt-in, with prax-sandbox-daemon.service: Prax loses the Docker socket.
#
# Prax then reaches the sandbox only through the daemon's loopback API
# (SANDBOX_DAEMON_URL). Make every Docker socket Prax could reach inaccessible
# to the Prax process — add your rootless socket path if you use one, e.g.
#   InaccessiblePaths=-/data2/PRAX/.docker-sock -/run/user/997/docker.sock
# (the leading '-' ignores a path that does not exist).
#
# Verified (2026-09-24): with Docker unreachable from the Prax process, sandbox
# shell and run_command (host paths translated) worked through the daemon, and
# the exec deadline was enforced there.
#
# The daemon must not be something Prax can rewrite or restart. When both run
# as the same account (the simple setup):
#   * the daemon's code tree is read-only to Prax (adjust the path);
#   * Prax gets its own PID namespace, so it cannot see or signal the daemon;
#   * the account's systemd user bus is unreachable, so Prax cannot start
#     units outside this confinement (e.g. to restart the daemon with new code).
# Stronger still: run the daemon under its own account (recommended when you
# can give that account the Docker socket).
[Service]
UnsetEnvironment=DOCKER_HOST DBUS_SESSION_BUS_ADDRESS
InaccessiblePaths=-/var/run/docker.sock -/run/docker.sock -/run/user/%U/bus -/run/user/%U/systemd
ReadOnlyPaths=-/home/ubuntu/PRAX/prax-sandbox
PrivatePIDs=yes
