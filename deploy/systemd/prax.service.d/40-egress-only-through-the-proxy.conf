# Opt-in: Prax may reach ONLY loopback. Every outside connection has to go
# through the forward proxy (HTTPS_PROXY), whose egress policy decides it —
# see docs/security/out-of-band-approvals.md, "Prax's own traffic".
#
# Enforced by the kernel (eBPF on the unit's cgroup), not by Prax: code running
# in the Prax process cannot open a socket to anywhere else, whatever it is
# told. Install:
#
#   sudo install -D -m644 40-egress-only-through-the-proxy.conf \
#        /etc/systemd/system/prax.service.d/40-egress-only-through-the-proxy.conf
#   sudo systemctl daemon-reload && sudo systemctl restart prax
#
# Before installing, make sure everything Prax talks to is either on loopback
# (TeamWork, Qdrant, Neo4j, the secrets proxy, the sandbox's published ports)
# or reached through HTTPS_PROXY, and set DISCORD_USE_PROXY=true — discord.py
# ignores proxy variables and would otherwise be cut off.
#
# Not covered: DNS. Prax's resolver is systemd-resolved on 127.0.0.53, which
# is loopback and so still reachable, and it forwards lookups upstream. A name
# Prax resolves can therefore still carry data out as a query. The proxy never
# resolves a name it has not allowed, but Prax's own SSRF checks resolve names
# before fetching them.
#
# The restriction binds this unit's cgroup — so Prax must not be able to start
# a process OUTSIDE it. If the service account runs a systemd user manager (it
# does when it runs rootless Docker), `systemd-run --user …` would do exactly
# that; its bus is made unreachable here.
[Service]
IPAddressDeny=any
IPAddressAllow=localhost
UnsetEnvironment=DBUS_SESSION_BUS_ADDRESS
InaccessiblePaths=-/run/user/%U/bus -/run/user/%U/systemd
